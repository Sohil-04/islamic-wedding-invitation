
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Haldi Ceremony | Aisha & Mayur</title>

  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body data-event="haldi">

  <!-- HEADER -->

  <header class="site-header">

    <a href="index.html" class="brand">A <span>&</span> M</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="haldi.html">Haldi</a>
      <a href="wedding.html">Nikah</a>
    </nav>

  </header>


  <!-- HALDI CONTENT -->

  <main class="event-page">

    <div class="hero-ornament">
      بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </div>

    <p class="eyebrow">THE CELEBRATION BEGINS</p>

    <h1 class="event-title">Haldi Ceremony</h1>

    <p class="event-subtitle"></p>

    <img
      class="event-image"
      src="assets/images/newhaldi.png"
      alt="Haldi celebration">

    <p class="event-description"></p>


    <!-- DATE AND VENUE -->

    <div class="details-card">

      <p class="eyebrow">DATE & TIME</p>

      <h2 class="event-date"></h2>

      <p class="event-time"></p>

      <div class="thin-line"></div>

      <p class="eyebrow">VENUE</p>

      <h3 class="event-venue"></h3>

      <p class="event-address"></p>

      <a
        href="#"
        class="primary-button location-button"
        target="_blank"
        rel="noopener">

        View Location

      </a>

    </div>


    <!-- SPECIAL MESSAGE -->

    <div class="event-highlight">
      <p class="event-highlight-text"></p>
    </div>


    <!-- DRESS CODE -->

    <p class="dress-code">
      Dress Code:
      <strong class="event-dress"></strong>
    </p>


    <!-- RSVP -->

    <button
      class="primary-button rsvp-button"
      type="button">

      Confirm on WhatsApp

    </button>


    <p>
      <a href="index.html" class="text-link">
        ← Back to Home
      </a>
    </p>

  </main>


  <!-- FOOTER -->

  <footer>
    <p>With love and duas · Aisha & Mayur</p>
  </footer>


  <!-- MUSIC -->

<audio id="backgroundMusic" loop preload="none">
    <source src="assets/music/wedding-song.mp3" type="audio/mpeg">
</audio>

<button id="musicButton" class="music-button" type="button">
    ♫ Play Music
</button>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
