<main id="main"><section class="inner-page narrow"><p class="eyebrow">KINDLY REPLY</p><h1 class="script page-title">RSVP</h1>
<form id="rsvpForm" class="rsvp-form" novalidate>
<label>Your name<input id="gName" name="name" type="text" autocomplete="name" required><small class="err" id="eName"></small></label>
<label>Number of guests<input id="gCount" name="count" type="number" min="1" max="20" value="1" required><small class="err" id="eCount"></small></label>
<fieldset><legend>Will you attend?</legend><label class="radio"><input type="radio" name="att" value="Yes, I will attend" required> Yes, I will attend</label><label class="radio"><input type="radio" name="att" value="Sorry, I cannot attend"> Sorry, I cannot attend</label><small class="err" id="eAtt"></small></fieldset>
<fieldset><legend>Events</legend><label class="radio"><input type="checkbox" name="ev" value="Haldi (21 Nov)" checked> Haldi, 21 Nov</label><label class="radio"><input type="checkbox" name="ev" value="Nikah & Wedding (22 Nov)" checked> Nikah &amp; Wedding, 22 Nov</label></fieldset>
<label>Message (optional)<textarea id="gMsg" name="msg" rows="4"></textarea></label>
<button class="gold-button" type="submit">Send RSVP on WhatsApp</button><p class="note">This opens WhatsApp with your reply already written.</p></form></section></main>
<footer class="site-footer"><p class="script">Two hearts, one beautiful journey.</p><span class="gold-line"><i></i>♡<i></i></span><p>With love, Aisha &amp; Mayur</p></footer>
